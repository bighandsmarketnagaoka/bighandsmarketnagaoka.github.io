  .panel dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

var KEY = 'bh-concierge-v1';
var state = { lang: 'ja', sessionId: '', messages: [], pending: false, dateValue: '', people: 2, style: '', view: 'chat' };

function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
function detectLang() {
  var l = (navigator.language || 'ja').slice(0, 2).toLowerCase();
  return TEXT[l] ? l : 'en';
}
function save() { try { sessionStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function load() {
  try {
    var s = JSON.parse(sessionStorage.getItem(KEY) || 'null');
    if (s && s.sessionId) { state.sessionId = s.sessionId; state.messages = s.messages || []; state.lang = s.lang || detectLang(); return; }
  } catch (e) {}
  state.sessionId = newId();
  state.lang = detectLang();
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function render() {
  var t = TEXT[state.lang];
  document.documentElement.lang = state.lang;
  document.getElementById('input').placeholder = t.placeholder;
  document.getElementById('input').setAttribute('aria-label', t.placeholder);
  document.getElementById('send').textContent = t.send;
  document.getElementById('privacyLink').textContent = t.privacy;
  document.getElementById('privacy').textContent = t.privacyBody;
  var rl = document.getElementById('restartLink');
  rl.textContent = t.newChat;
  rl.hidden = !!state.pending;
  document.getElementById('lang').value = state.lang;
  renderTabs(t);
  var store = state.view !== 'chat' && (CFG.tabs || []).filter(function (s) { return s.id === state.view; })[0];
  document.getElementById('panel').hidden = !store;
  document.getElementById('log').hidden = !!store;
  if (store) { renderPanel(store, t); updateSend(); return; }

  var log = document.getElementById('log');
  log.innerHTML = '';
  if (state.view === 'book' && bk) { renderBook(log, t); updateSend(); return; }
  if (state.view === 'inquiry' && iq) { renderInquiry(log, t); updateSend(); return; }
  if (state.view === 'reception' && rc) { renderReception(log, t); updateSend(); return; }
  if (CFG.reception && !state.messages.length) {
    var rb = el('button', 'ask', (CFG.reception.title || 'オープニングレセプション') + 'のご案内'); rb.type = 'button';
    rb.onclick = openReception;
    log.appendChild(rb);
  }
  if (CFG.hero && !state.messages.length) {
    var hero = el('div', 'hero');
    var hi = document.createElement('img');
    hi.src = CFG.hero; hi.alt = ''; hi.onerror = function () { hero.remove(); };
    hero.appendChild(hi);
    log.appendChild(hero);
  }
  log.appendChild(el('p', 'bubble assistant welcome', t.welcome));

  if (!state.messages.length && CFG.promo && CFG.booking && !CFG.booking.stopped) {
    var ja = state.lang === 'ja';
    var pr = el('div', 'promo');
    pr.appendChild(el('p', 'promo-title', ja ? CFG.promo.title : 'Year-end & New Year parties'));
    var ptxt = ja ? CFG.promo.text : 'Now taking bookings for year-end and New Year parties. Food from 5,000 JPY per person, all-you-can-drink from 2,000 JPY (2 hours). From small dinners to private hire of the whole market — just ask.';
    if (ptxt) pr.appendChild(el('p', 'promo-text', ptxt));
    var pb = el('button', 'ask', ja ? '団体・貸切の申し込み・ご相談' : 'Request a party booking'); pb.type = 'button';
    pb.onclick = function () { openInquiry('group'); if (!iq.note) { iq.note = ja ? '忘年会・新年会' : 'Year-end / New Year party'; render(); } };
    pr.appendChild(pb);
    log.appendChild(pr);
  }
  if (!state.messages.length) {
    var chips = el('div', 'chips');
    t.shortcuts.forEach(function (s) {
      var cat = ['restaurant', 'group', 'catering', 'tour', 'other'][t.shortcuts.indexOf(s)];
      if (CFG.categories && CFG.categories.indexOf(cat) < 0) return;
      var b = el('button', 'chip', s[0]);
      b.type = 'button';
      b.onclick = function () { if (cat === 'restaurant' && CFG.booking && !CFG.booking.stopped && (CFG.booking.courses || []).length) openBook(); else if ((cat === 'group' || cat === 'tour') && CFG.booking && !CFG.booking.stopped) openInquiry(cat); else send(s[1], cat); };
      chips.appendChild(b);
    });
    log.appendChild(chips);
  }
  if (!state.messages.length && (CFG.tabs || []).length) {
    var sec = el('div', 'shops');
    sec.appendChild(el('p', 'shops-title', t.shopsTitle));
    var grid = el('div', 'shop-grid');
    CFG.tabs.map(locStore).forEach(function (st) {
      var b = el('button', 'shop');
      b.type = 'button';
      if (st.image) {
        var im = document.createElement('img');
        im.src = st.image; im.alt = ''; im.loading = 'lazy';
        b.classList.add('has-img');
        im.onerror = function () { im.remove(); b.classList.remove('has-img'); };
        b.appendChild(im);
      }
      b.appendChild(el('span', '', st.name.replace(/\s*-.*-\s*$/, '')));
      if (st.genre) b.appendChild(el('small', '', st.genre));
      b.onclick = function () { state.view = st.id; render(); window.scrollTo(0, 0); };
      grid.appendChild(b);
    });
    sec.appendChild(grid);
    log.appendChild(sec);
  }

  state.messages.forEach(function (m) {
    var row = el('div', 'row ' + m.role);
    row.appendChild(el('p', 'bubble ' + m.role, m.role === 'assistant' ? String(m.content).replace(/\*\*/g, '') : m.content));
    (m.ui || []).forEach(function (u) {
      if (u.type === 'stores') { row.appendChild(storeCards(u.items || [], t)); return; }
      if (u.type !== 'receipt') return;
      var card = el('div', 'receipt');
      card.appendChild(el('p', 'receipt-label', t.receiptTitle));
      card.appendChild(el('p', 'receipt-id', u.receiptId));
      card.appendChild(el('p', 'receipt-note', t.receiptNote));
      row.appendChild(card);
    });
    log.appendChild(row);
  });

  if (state.pending) log.appendChild(el('p', 'bubble assistant thinking', t.thinking));

  var last = state.messages[state.messages.length - 1];
  if (!state.pending && last && last.role === 'assistant') {
    (last.ui || []).forEach(function (u) {
      if (u.type === 'choices') {
        var c = el('div', 'chips');
        u.options.forEach(function (o) {
          var b = el('button', 'chip', o);
          b.type = 'button';
          b.onclick = function () { send(o); };
          c.appendChild(b);
        });
        log.appendChild(c);
      } else if (u.type === 'date') {
        var d = el('div', 'datepick');
        var inp = document.createElement('input');
        inp.type = 'date';
        if (u.min) inp.min = u.min;
        inp.value = state.dateValue;
        var b2 = el('button', 'chip', t.pickDate);
        b2.type = 'button';
        b2.disabled = !state.dateValue;
        inp.oninput = function () { state.dateValue = inp.value; b2.disabled = !inp.value; };
        b2.onclick = function () { send(inp.value); };
        d.appendChild(inp);
        d.appendChild(b2);
        log.appendChild(d);
      } else if (u.type === 'details') {
        log.appendChild(detailsForm(u, t));
      } else if (u.type === 'course') {
        log.appendChild(courseForm(u, t));
      } else if (u.type === 'contact') {
        log.appendChild(contactForm(t, u));
      }
    });
    if ((last.ui || []).some(function (u) { return u.type === 'receipt'; })) {
      var r = el('button', 'link', t.newChat);
      r.type = 'button';
      r.onclick = function () { state.messages = []; state.sessionId = newId(); save(); render(); };
      log.appendChild(r);
    }
  }
  var end = el('div', 'end');
  log.appendChild(end);
  requestAnimationFrame(function () { end.scrollIntoView({ block: 'end' }); });
  updateSend();
}

function locStore(s) {
  if (!s || state.lang === 'ja' || !s.en) return s;
  var o = {};
  Object.keys(s).forEach(function (k) { o[k] = s[k]; });
  ['name', 'genre', 'description', 'area', 'hours', 'reserve'].forEach(function (k) { if (s.en[k]) o[k] = s.en[k]; });
  return o;
}

function renderTabs(t) {
  var nav = document.getElementById('tabs');
  var tabs = CFG.tabs || [];
  nav.hidden = !tabs.length;
  if (!tabs.length) return;
  nav.innerHTML = '';
  [{ id: 'chat', name: t.concierge }].concat(tabs.map(locStore)).forEach(function (s) {
    var b = el('button', 'tab' + (state.view === s.id ? ' on' : ''), s.name.replace(/\s*-.*-\s*$/, ''));
    b.type = 'button';
    b.setAttribute('aria-pressed', state.view === s.id ? 'true' : 'false');
    b.onclick = function () { state.view = s.id; render(); window.scrollTo(0, 0); };
    nav.appendChild(b);
  });
}

function renderPanel(s, t) {
  s = locStore(s);
  var p = document.getElementById('panel');
  p.innerHTML = '';
  if (s.image) {
    var hero = el('div', 'hero');
    var img = document.createElement('img');
    img.src = s.image; img.alt = s.name; img.onerror = function () { hero.remove(); };
    hero.appendChild(img);
    p.appendChild(hero);
  }
  p.appendChild(el('h1', 'panel-name', s.name));
  var meta = [s.genre, s.area].filter(Boolean).join('｜');
  if (meta) p.appendChild(el('p', 'panel-meta', meta));
  if (s.description) p.appendChild(el('p', 'panel-desc', s.description));
  var dl = document.createElement('dl');
  [[t.hours, s.hours], [t.reserve, s.reserve], [t.address, s.address]].forEach(function (r) {
    if (!r[1]) return;
    dl.appendChild(el('dt', '', r[0]));
    dl.appendChild(el('dd', '', r[1]));
  });
  if (dl.childNodes.length) p.appendChild(dl);
  var links = el('div', 'store-links');
  [[s.map, t.map], [s.web, t.web], [s.instagram, t.insta]].forEach(function (x) {
    if (!x[0] || !/^https:\/\//.test(x[0])) return;
    var a = el('a', '', x[1]);
    a.href = x[0]; a.target = '_blank'; a.rel = 'noopener noreferrer';
    links.appendChild(a);
  });
  if (links.childNodes.length) p.appendChild(links);
  var ask = el('button', 'ask', t.ask);
  ask.type = 'button';
  ask.onclick = function () { state.view = 'chat'; send(t.askMsg.replace('{name}', s.name)); };
  p.appendChild(ask);
  if (s.id === 'yamahachi' && CFG.booking && !CFG.booking.stopped && (CFG.booking.courses || []).length) {
    var bkb = el('button', 'ask', bookText().title); bkb.type = 'button';
    bkb.onclick = openBook;
    p.insertBefore(bkb, ask);
  }
}

function storeCards(items, t) {
  var wrap = el('div', 'stores');
  items.map(locStore).forEach(function (s) {
    var card = el('div', 'store' + (s.image ? '' : ' noimg'));
    if (s.image) {
      var img = document.createElement('img');
      img.src = s.image; img.alt = s.name; img.loading = 'lazy';
      img.onerror = function () { img.remove(); card.classList.add('noimg'); };
      card.appendChild(img);
    }
    var b = el('div', 'store-body');
    b.appendChild(el('p', 'store-name', s.name));
    var meta = [s.genre, s.area].filter(Boolean).join('｜');
    if (meta) b.appendChild(el('p', 'store-meta', meta));
    if (s.description) b.appendChild(el('p', 'store-desc', s.description));
    if (s.hours) b.appendChild(el('p', 'store-meta', s.hours));
    if (s.reserve) b.appendChild(el('p', 'store-meta', t.reserve + '：' + s.reserve));
    var links = el('div', 'store-links');
    [[s.map, t.map], [s.web, t.web], [s.instagram, t.insta]].forEach(function (p) {
      if (!p[0] || !/^https:\/\//.test(p[0])) return;
      var a = el('a', '', p[1]);
      a.href = p[0]; a.target = '_blank'; a.rel = 'noopener noreferrer';
      links.appendChild(a);
    });
    if (links.childNodes.length) b.appendChild(links);
    card.appendChild(b);
    wrap.appendChild(card);
  });
  return wrap;
}

function formatDate(iso) {
  try {
    var p = iso.split('-').map(Number);
    var wd = new Intl.DateTimeFormat(state.lang, { weekday: 'short', timeZone: 'UTC' }).format(new Date(Date.UTC(p[0], p[1] - 1, p[2])));
    return iso + '（' + wd + '）';
  } catch (e) { return iso; }
}

function courseForm(u, t) {
  var f = el('div', 'form');
  var people = Number(u.people) || 2;
  var chosen = '';
  var counts = {};
  f.appendChild(el('p', 'field-label', t.kCourse));
  var list = el('div', 'course-list');
  (u.courses || []).forEach(function (c) {
    var b = el('button', 'course');
    b.type = 'button';
    var top = el('span', 'course-top');
    top.appendChild(el('span', 'course-name', c.name));
    if (c.price) top.appendChild(el('span', 'course-price', c.price));
    b.appendChild(top);
    if (c.description) b.appendChild(el('span', 'course-desc', c.description));
    b.onclick = function () {
      chosen = c.name;
      list.querySelectorAll('.course').forEach(function (x) { x.classList.remove('on'); x.setAttribute('aria-pressed', 'false'); });
      b.classList.add('on'); b.setAttribute('aria-pressed', 'true');
      check();
    };
    list.appendChild(b);
  });
  f.appendChild(list);
  var left = el('p', 'pair-left', '');
  if ((u.pairings || []).length) {
    f.appendChild(el('p', 'field-label', t.kPair));
    var pl = el('div', 'pair-list');
    (u.pairings || []).forEach(function (p) {
      counts[p.name] = 0;
      var row = el('div', 'pair');
      var lab = el('span', 'pair-name', p.name + (p.price ? '　' + p.price : ''));
      var st = el('div', 'stepper');
      var minus = el('button', '', '−'); minus.type = 'button';
      var val = el('span', 'pair-n', '0');
      var plus = el('button', '', '+'); plus.type = 'button';
      var total = function () { return Object.keys(counts).reduce(function (a, k) { return a + counts[k]; }, 0); };
      minus.onclick = function () { if (counts[p.name] > 0) { counts[p.name]--; val.textContent = counts[p.name]; check(); } };
      plus.onclick = function () { if (total() < people) { counts[p.name]++; val.textContent = counts[p.name]; check(); } };
      st.appendChild(minus); st.appendChild(val); st.appendChild(plus);
      row.appendChild(lab); row.appendChild(st);
      pl.appendChild(row);
    });
    f.appendChild(pl);
    f.appendChild(left);
  }
  var go = el('button', 'send-form', t.kSend);
  go.type = 'button';
  function check() {
    var used = Object.keys(counts).reduce(function (a, k) { return a + counts[k]; }, 0);
    left.textContent = t.kLeft.replace('{n}', people - used);
    go.disabled = !chosen;
  }
  go.onclick = function () {
    var parts = Object.keys(counts).filter(function (k) { return counts[k] > 0; }).map(function (k) { return k + '×' + counts[k]; });
    var used = Object.keys(counts).reduce(function (a, k) { return a + counts[k]; }, 0);

    card.appendChild(el('p', 'receipt-label', rc.result.attend === '出席' ? 'ご出席を承りました' : 'ご返信ありがとうございます'));
    card.appendChild(el('p', 'receipt-id', rc.result.receiptId));
    card.appendChild(el('p', 'receipt-note', rc.result.attend === '出席'
      ? rc.result.people + '名様でお待ちしております。会費 ' + Number(rc.result.fee).toLocaleString() + '円は当日受付にて現金でお願いいたします。控えのメールをお送りしました。'
      : '今回はご欠席と承りました。またのご来館を心よりお待ちしております。'));
    wrap.appendChild(card);
    log.appendChild(wrap);
    return;
  }
  if (!R.open) {
    wrap.appendChild(el('p', 'bk-avail ng', 'ご返信の受付は締め切りました（' + (R.deadlineLabel || '') + '）。ご連絡はお電話またはメールでお願いいたします。'));
    log.appendChild(wrap);
    return;
  }
  wrap.appendChild(el('p', 'bk-step', 'ご出欠'));
  var ch = el('div', 'chips');
  [['yes', '出席'], ['no', '欠席']].forEach(function (o) {
    var b = el('button', 'chip' + (rc.attend === o[0] ? ' on' : ''), o[1]); b.type = 'button';
    b.setAttribute('aria-pressed', rc.attend === o[0] ? 'true' : 'false');
    b.onclick = function () { rc.attend = o[0]; render(); };
    ch.appendChild(b);
  });
  wrap.appendChild(ch);
  var text = function (label, key, type, ac, area, hint) {
    var w = el('div', 'field');
    var l = el('label', 'field-label', label); l.setAttribute('for', 'rc-' + key);
    var i = document.createElement(area ? 'textarea' : 'input');
    if (!area) i.type = type || 'text'; else { i.rows = 2; i.maxLength = 500; }
    i.id = 'rc-' + key; i.className = 'text-in'; if (ac) i.autocomplete = ac; if (hint) i.placeholder = hint;
    i.value = rc[key];
    i.oninput = function () { rc[key] = i.value; update(); };
    w.appendChild(l); w.appendChild(i); wrap.appendChild(w);
  };
  text('お名前', 'name', 'text', 'name');
  text('会社名・ご所属（任意）', 'company', 'text', 'organization');
  text('メールアドレス', 'email', 'email', 'email');
  text('電話番号', 'phone', 'tel', 'tel');
  if (rc.attend === 'yes') {
    var fp = el('div', 'field');
    fp.appendChild(el('p', 'field-label', 'ご出席の人数（ご本人を含む）'));
    var st = el('div', 'stepper');
    var minus = el('button', '', '−'); minus.type = 'button';
    var pv = el('span', 'pair-n', String(rc.people));
    var plus = el('button', '', '+'); plus.type = 'button';
    minus.onclick = function () { if (rc.people > 1) { rc.people--; render(); } };
    plus.onclick = function () { if (rc.people < 20) { rc.people++; render(); } };
    st.appendChild(minus); st.appendChild(pv); st.appendChild(plus); st.appendChild(el('span', '', '名'));
    fp.appendChild(st); wrap.appendChild(fp);
    if (rc.people > 1) text('ご同伴の方のお名前', 'companions', 'text', '', false, '例：山田花子、佐藤一郎');
  }
  text('ひとことメッセージ（任意）', 'message', '', '', true);
  var aw = el('label', 'agree');
  var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = rc.agree;
  cb.onchange = function () { rc.agree = cb.checked; update(); };
  aw.appendChild(cb); aw.appendChild(el('span', '', 'ご連絡先は、このレセプションのご案内のためだけに SUZU GROUP が利用することに同意します'));
  wrap.appendChild(aw);
  if (R.deadlineLabel) wrap.appendChild(el('p', 'pair-left', 'ご返信の締め切り：' + R.deadlineLabel));
  var errP = el('p', 'bk-err', '');
  wrap.appendChild(errP);
  var go = el('button', 'send-form', '返信する'); go.type = 'button';
  wrap.appendChild(go);
  log.appendChild(wrap);
  function update() {
    var ok = rc.name.trim() && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(rc.email.trim()) && /^[0-9+\-() ]{6,20}$/.test(rc.phone.trim()) && rc.agree;
    go.disabled = !ok || rc.sending;
    go.textContent = rc.sending ? '送信しています…' : (rc.attend === 'yes' ? '出席で返信する' : '欠席で返信する');
    errP.textContent = rc.err;
  }
  go.onclick = function () {
    if (go.disabled) return;
    rc.sending = true; rc.err = ''; update();
    var payload = { sessionId: state.sessionId, code: R.code, website: document.getElementById('hp').value, attend: rc.attend,
      name: rc.name.trim(), company: rc.company.trim(), email: rc.email.trim(), phone: rc.phone.trim(), people: rc.people,
      companions: rc.companions.trim(), message: rc.message.trim(), agree: rc.agree };
    google.script.run.withSuccessHandler(function (r) {
      rc.sending = false;
      if (r && r.ok) { rc.result = r; render(); window.scrollTo(0, 0); return; }
      var e = r && r.error;
      rc.err = e === 'closed' ? 'ご返信の受付は締め切りました。' : e === 'busy' ? '混み合っています。少し待ってからもう一度お試しください。' : e === 'invalid' ? '入力内容をご確認ください。' : '送信できませんでした。お手数ですがお電話かメールでご連絡ください。';
      update();
    }).withFailureHandler(function () { rc.sending = false; rc.err = '送信できませんでした。もう一度お試しください。'; update(); }).receptionReply(payload);
  };
  update();
}

function updateSend() {
  document.getElementById('send').disabled = state.pending || !document.getElementById('input').value.trim();
}

function send(text, shortcut) {
  var content = String(text || '').trim();
  if (!content || state.pending) return;
  state.view = 'chat';
  var t = TEXT[state.lang];
  state.messages.push({ role: 'user', content: content });
  state.pending = true;
  state.dateValue = '';
  document.getElementById('input').value = '';
  save();
  render();
  var payload = {
    sessionId: state.sessionId,
    locale: state.lang,
    shortcut: shortcut || '',
    website: document.getElementById('hp').value,
    messages: state.messages.map(function (m) { return { role: m.role, content: m.content }; })
  };
  var done = function (data) {
    state.pending = false;
    state.messages.push({ role: 'assistant', content: (data && data.reply) || t.networkError, ui: (data && data.ui) || [] });
    save();
    render();
  };
  google.script.run.withSuccessHandler(done).withFailureHandler(function () { done(null); }).chat(payload);
}

(function init() {
  load();
  if (CFG.logo) {
    var lg = document.getElementById('logo');
    lg.src = CFG.logo;
    lg.onload = function () { lg.hidden = false; document.getElementById('brandText').hidden = true; };
  }
  if (CFG.catchImg) {
    var cc = document.getElementById('catch');
    cc.src = CFG.catchImg;
    cc.onload = function () { cc.hidden = false; document.getElementById('tagline').hidden = true; };
  }
  var sel = document.getElementById('lang');
  Object.keys(TEXT).forEach(function (k) {
    var o = document.createElement('option');
    o.value = k;
    o.textContent = TEXT[k].label;
    sel.appendChild(o);
  });
  sel.onchange = function () { state.lang = sel.value; save(); render(); };
  if (CFG.reception) { rc = null; openReception(); }
  var input = document.getElementById('input');
  input.oninput = updateSend;
  input.onkeydown = function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(input.value); }
  };
  document.getElementById('composer').onsubmit = function (e) { e.preventDefault(); send(input.value); };
  document.getElementById('restartLink').onclick = function () { state.messages = []; state.sessionId = newId(); state.dateValue = ''; state.style = ''; state.view = 'chat'; save(); render(); window.scrollTo(0, 0); };
  document.getElementById('privacyLink').onclick = function () {
    var p = document.getElementById('privacy');
    p.hidden = !p.hidden;
  };
  render();
})();
</script>

<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbzVxSEMjJ_gxR8k7lA9lPN_RKSUw_J6s_wp9kwA4wr9DRJ9LfcMSzFbe4eQUE-wY_SprQ/exec";
  // google.script.run の代わり：Apps Script の API に POST する（ログイン情報は送らない）
  function call(fn, arg, ok, ng) {
    fetch(API, { method: "POST", credentials: "omit", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: fn, arg: arg }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.ok) { ok && ok(j.result); } else { ng && ng(new Error((j && j.error) || "error")); } })
      .catch(function (e) { ng && ng(e); });
  }
  function runner(ok, ng) {
    return new Proxy({}, {
      get: function (_, k) {
        if (k === "withSuccessHandler") return function (f) { return runner(f, ng); };
        if (k === "withFailureHandler") return function (f) { return runner(ok, f); };
        return function (arg) { call(String(k), arg, ok, ng); };
      }
    });
  }
  window.google = { script: { run: runner(null, null) } };

  // 読み込み中の表示（Apps Script が起きるまで数秒かかることがある）
  var boot = document.createElement("div");
  boot.id = "boot";
  boot.setAttribute("role", "status");
  boot.style.cssText = "position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#fff;color:#5b564e;font:14px/1.6 'Noto Sans JP','Hiragino Sans',sans-serif;z-index:99;letter-spacing:.08em";
  var lang = (navigator.language || "ja").slice(0, 2);
  boot.innerHTML = '<div style="font-family:Shippori Mincho,serif;font-size:17px;letter-spacing:.18em;color:#1e1c19">BIG HANDS MARKET</div><div>' + (lang === "ja" ? "読み込み中…" : "Loading…") + "</div>";
  document.body.appendChild(boot);

  function start(cfg) {
    if (boot.parentNode) boot.parentNode.removeChild(boot);
    document.getElementById("cfg").textContent = JSON.stringify(cfg || {});
    var s = document.createElement("script");
    s.text = document.getElementById("app").textContent;
    document.body.appendChild(s);
  }
  var inv = new URLSearchParams(location.search).get("invite");
  var from = new URLSearchParams(location.search).get("from");
  var url = API + "?api=config" + (inv ? "&invite=" + encodeURIComponent(inv) : "") + (from ? "&from=" + encodeURIComponent(from) : "");
  var done = false;
  var t = setTimeout(function () { if (!done) { done = true; start({}); } }, 12000);
  fetch(url, { credentials: "omit", redirect: "follow" })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!done) { done = true; clearTimeout(t); start(j && j.cfg); } })
    .catch(function () { if (!done) { done = true; clearTimeout(t); start({}); } });
})();
</script>
