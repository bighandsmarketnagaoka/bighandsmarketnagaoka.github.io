<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>山八 スタッフ用</title>
</head>
<body style="margin:0;background:#fff">
<div id="boot" role="status" style="padding:40px 16px;text-align:center;color:#5b564e;font:14px/1.6 'Hiragino Sans',sans-serif">読み込み中…</div>
<div id="root"></div>
<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbzVxSEMjJ_gxR8k7lA9lPN_RKSUw_J6s_wp9kwA4wr9DRJ9LfcMSzFbe4eQUE-wY_SprQ/exec";
  var q = new URLSearchParams(location.search);
  var staff = q.get("staff") || "", t = q.get("t") || "";
  function call(fn, args, ok, ng) {
    fetch(API, { method: "POST", credentials: "omit", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.ok) { ok && ok(j.result); } else { ng && ng(new Error((j && j.error) || "error")); } })
      .catch(function (e) { ng && ng(e); });
  }
  function runner(ok, ng) {
    return new Proxy({}, { get: function (_, k) {
      if (k === "withSuccessHandler") return function (f) { return runner(f, ng); };
      if (k === "withFailureHandler") return function (f) { return runner(ok, f); };
      return function () { call(String(k), Array.prototype.slice.call(arguments), ok, ng); };
    } });
  }
  window.google = { script: { run: runner(null, null) } };
  function fail() { document.getElementById("boot").textContent = "読み込めませんでした。電波のよい場所でもう一度開いてください。"; }
  if (!staff || !t) { document.getElementById("boot").textContent = "このリンクは使えません。"; return; }
  fetch(API + "?api=staff&staff=" + encodeURIComponent(staff) + "&t=" + encodeURIComponent(t), { credentials: "omit", redirect: "follow" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.ok) return fail();
      if (j.title) document.title = j.title;
      var h = document.createElement("div"); h.innerHTML = j.css;
      Array.prototype.slice.call(h.childNodes).forEach(function (n) { document.head.appendChild(n); });
      var root = document.getElementById("root"); root.innerHTML = j.html;
      root.querySelectorAll("script").forEach(function (old) { var s = document.createElement("script"); s.text = old.textContent; old.parentNode.replaceChild(s, old); });
      var b = document.getElementById("boot"); if (b) b.parentNode.removeChild(b);
    })
    .catch(fail);
})();
</script>
</body>
</html>
